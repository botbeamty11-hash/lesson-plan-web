<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}บริการครู — แผนและเอกสาร{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=6"></head>
<body><header><div class="in"><a class="brand" href="/"><span class="logo">📘</span>บริการครู</a>
<nav>
  <a href="/" {% if request.path == '/' %}class="on"{% endif %}>หน้าแรก</a>
  <a href="/services" {% if request.path.startswith('/services') or request.path.startswith('/group') %}class="on"{% endif %}>บริการทั้งหมด</a>
  <a href="/track" {% if request.path.startswith('/track') or request.path.startswith('/job') %}class="on"{% endif %}>ติดตามงาน</a>
</nav></div></header>
<main class="{% if request.path.startswith('/admin') %}main-wide{% endif %}">
{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash {% if 'เรียบร้อย' in m or 'เสร็จ' in m %}ok{% endif %}">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main><footer>บริการจัดทำแผนและเอกสารสำหรับครู</footer>
{% block scripts %}{% endblock %}</body></html>
