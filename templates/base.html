<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}ระบบจัดทำแผนการจัดการเรียนรู้{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5"></head>
<body><header><div class="in"><a class="brand" href="/"><span class="logo">📘</span>ระบบจัดทำแผนการจัดการเรียนรู้</a>
<nav><a href="/">ส่งงานใหม่</a></nav></div></header>
<main class="{% if request.path.startswith('/admin') %}main-wide{% endif %}">
{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash {% if 'เรียบร้อย' in m %}ok{% endif %}">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main><footer>ระบบส่งข้อมูลเพื่อจัดทำแผนการจัดการเรียนรู้</footer>
{% block scripts %}{% endblock %}</body></html>
